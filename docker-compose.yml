services:
  db:
    image: pgvector/pgvector:pg17
    container_name: neulmed_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fourleaves
      POSTGRES_PASSWORD: koren1234
      POSTGRES_DB: neulmed
    ports:
      - "5432:5432"
    volumes:
      - koren_pgdata:/var/lib/postgresql/data

volumes:
  koren_pgdata:
